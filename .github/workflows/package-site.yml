name: Package REF WEB site

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Create ready ZIP
        run: |
          zip -r ref-web-ready.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'ref-web-ready.zip'

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ref-web-ready
          path: ref-web-ready.zip
          if-no-files-found: error
          retention-days: 1
